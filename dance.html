<!DOCTYPE html>
<html>

<head>
    <title>Sunday School Action Dance</title>

    <style>
        body {
            font-family: Arial;
            background-color: #fff4d6;
            text-align: center;
            padding: 30px;
        }

        h1 {
            color: #ff6b6b;
        }

        /* Back to Home Button */
        .home-button {
            position: absolute;
            top: 20px;
            right: 20px;

            background-color: #ff6b6b;
            color: white;
            border: none;

            padding: 12px 20px;
            border-radius: 20px;

            cursor: pointer;
            font-size: 16px;
        }

        .home-button:hover {
            background-color: #ff4f4f;
        }

        .dance {
            background-color: white;
            width: 400px;
            max-width: 90%;
            margin: 30px auto;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #ccc;
        }

        .dance h2 {
            color: #ff8a65;
        }

        .dance button {
            background-color: #ff6b6b;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .dance button:hover {
            background-color: #ff4f4f;
        }
    </style>
</head>

<body>

    <!-- Back to Home Button -->
    <button class="home-button" onclick="window.location.href='index.html'">
        🏠 Back to Home
    </button>


    <h1>💃 Sunday School Action Dance 🕺</h1>


    <div id="danceContainer">
        Loading dance...
    </div>


    <script>

        fetch("http://localhost:5000/api/dance")

            .then(response => response.json())

            .then(data => {

                let html = "";

                data.forEach(dance => {

                    html += `

                        <div class="dance">

                            <h2>💃 ${dance.title} 🕺</h2>

                            <p>
                                Learn and enjoy action songs!
                            </p>

                            <button onclick="watchVideo('${dance.youtube}')">
                                ▶️ Watch Dance Video
                            </button>

                        </div>

                    `;

                });

                document.getElementById("danceContainer").innerHTML = html;

            })

            .catch(error => {

                document.getElementById("danceContainer").innerHTML =
                    "❌ Cannot connect to backend.";

                console.log(error);

            });


        function watchVideo(link) {

            window.open(link, "_blank");

        }

    </script>

</body>

</html>
